<!doctype html>
<html lang="en-US">
    <head>
        <meta charset="utf-8">
        <title>Test Title</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            Learning Tracker
        </header>
        <br>

        <main class="wrapper">
            <!-- A section for the form -->
            <section class="col1">
                <form>
                    <h3>Add an Activity</h3>
                    <p>
                        <label for="title">Title</label>
                        <input type="text" name="title" id="title" required>
                    </p>
                    <p>
                        <label for="topic">Topic</label>
                        <input type="text" name="topic" id="topic" required>
                    </p>
                    <p>
                        <label for="minutes">Minutes</label>
                        <input type="number" name="minutes" id="minutes" required>
                    </p>
                    <p>
                        <label for="date">Date</label>
                        <input type="date" name="date" id="date" required>
                    </p>
                    <p>
                        <label for="status">Status</label>
                        <select name="status" id="status" required>
                            <option value="planned">Planned</option>
                            <option value="inProgress">In progress</option>
                            <option value="completed">Completed</option>
                        </select>
                    </p>
                    <p>
                        <label for="reflection">Reflection (optional)</label>
                        <input type="text" name="reflection" id="reflection">
                    </p>
                    <p>
                        <button>Add Activity</button>
                    </p>
                </form>
            </section>
            <br>

            <!-- A section for the activity list and summary -->
            <section class="col2">
                <h3>Activity List</h3>
                <section class="activitylist">
                    // Javascript will populate this section with the list of activities
                </section>
                <br>

                <h3>Summary</h3>
                <section class="summary">
                    // Javascript will populate this section with the summary of activities
                </section>
            </section>
            <br>

        </main>

        <footer>
            All rights are reserved or something.
        </footer>

    </body>
    <script src="app.js"></script>
</html>
